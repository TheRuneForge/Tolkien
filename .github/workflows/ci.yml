name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Format, lint, test, and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      NEXTEST_VERSION: "0.9.152"
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Install cargo-nextest
        shell: bash
        run: curl -LsSf "https://get.nexte.st/${NEXTEST_VERSION}/linux" | tar zxf - -C "${CARGO_HOME:-$HOME/.cargo}/bin"

      - name: Run tests
        id: tests
        run: cargo nextest run --profile ci --all-targets --all-features

      - name: Mergify Test Engine Upload
        if: (success() || failure()) && (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && hashFiles('target/nextest/ci/junit.xml') != ''
        uses: mergifyio/gha-mergify-ci@v30
        with:
          report_path: target/nextest/ci/junit.xml
          test_step_outcome: ${{ steps.tests.outcome }}
          mergify_cli_version: "2026.11.22"

      - name: Build
        run: cargo build --all-targets --all-features
