area/core:
  - changed-files:
      - any-glob-to-any-file:
          - 'src/**'
          - 'Cargo.toml'

area/tests:
  - changed-files:
      - any-glob-to-any-file:
          - 'tests/**'

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - 'docs/**'
          - '*.md'
          - 'zensical.toml'
          - 'requirements-docs.txt'

ci:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**'
          - '.mergify.yml'
          - 'release-please-config.json'
          - '.release-please-manifest.json'
